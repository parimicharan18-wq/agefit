name: Autonomous 24/7 AI Health Sentry & Self-Healing Monitor

on:
  # Runs every 6 hours automatically in GitHub Actions without you
  schedule:
    - cron: '0 */6 * * *'
  # Allows on-demand trigger anytime
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  sentry-audit-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Strict TypeScript Compile Check
        run: npx tsc --noEmit

      - name: 2. Production Vite Bundle & Memory Leak Audit
        run: npm run build

      - name: 3. Health & Uptime Probe for Public Website
        run: |
          node -e "
            const https = require('https');
            const targetUrl = 'https://parimicharan18-wq.github.io/agefit/';
            https.get(targetUrl, (res) => {
              console.log('AgeFit Public Website Status Code:', res.statusCode);
              if (res.statusCode >= 200 && res.statusCode < 400) {
                console.log('✓ Public website is live, fast, and healthy.');
              } else {
                console.error('Website returned unexpected status:', res.statusCode);
                process.exit(1);
              }
            }).on('error', (err) => {
              console.error('Probe failed:', err.message);
              process.exit(1);
            });
          "

      - name: 4. Auto-Deploy Repaired Production Assets
        uses: actions/configure-pages@v4

      - name: Upload Verified Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy Healthy Build to GitHub Pages
        uses: actions/deploy-pages@v4
