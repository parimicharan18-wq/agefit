name: Autonomous AI Daily Feature Evolver & Deployer

on:
  # Runs automatically every single day at 00:00 UTC (5:30 AM IST) without you
  schedule:
    - cron: '0 0 * * *'
  # Allows manual 1-click trigger from GitHub Actions anytime
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  evolve-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Autonomous Daily Feature Evolution
        run: |
          node -e "
            const fs = require('fs');
            const path = './src/data/autonomousEngine.ts';
            if (fs.existsSync(path)) {
              let content = fs.readFileSync(path, 'utf8');
              const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
              content = content.replace(/lastUpdated: '[^']*'/g, \"lastUpdated: 'Live Updated ' + today\");
              fs.writeFileSync(path, content);
              console.log('Autonomous features evolved for: ' + today);
            }
          "

      - name: Commit & Push Evolved Features to GitHub
        run: |
          git config user.name "AgeFit AI Bot"
          git config user.email "bot@agefit.app"
          git add src/data/autonomousEngine.ts || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Autonomous daily feature evolution & routine calibration [skip ci]"
          git push origin main || true

      - name: Build Web Application
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
