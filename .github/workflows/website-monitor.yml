name: Periodic Website Health & Uptime Probe

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) automatically for free
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Dual Uptime & Asset Probe (GitHub Pages & Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Probe Public AgeFit Deployments
        run: |
          node -e "
            const https = require('https');

            const targets = [
              'https://parimicharan18-wq.github.io/agefit/',
              'https://agefit-app.vercel.app/'
            ];

            function checkUrl(url) {
              return new Promise((resolve, reject) => {
                function attemptCheck(attempt) {
                  console.log('Testing: ' + url + ' (Attempt ' + attempt + ')');
                  https.get(url, (res) => {
                    console.log('Status for ' + url + ':', res.statusCode);
                    if (res.statusCode >= 200 && res.statusCode < 400) {
                      console.log('✓ Verified: ' + url + ' is healthy.');
                      resolve();
                    } else if (attempt < 3) {
                      console.log('Retrying ' + url + ' in 3 seconds...');
                      setTimeout(() => attemptCheck(attempt + 1), 3000);
                    } else {
                      reject(new Error('Status ' + res.statusCode + ' for ' + url));
                    }
                  }).on('error', (err) => {
                    if (attempt < 3) {
                      console.log('Network warning: ' + err.message + '. Retrying...');
                      setTimeout(() => attemptCheck(attempt + 1), 3000);
                    } else {
                      reject(err);
                    }
                  });
                }
                attemptCheck(1);
              });
            }

            Promise.all(targets.map(checkUrl))
              .then(() => {
                console.log('All public AgeFit deployments are live and healthy!');
                process.exit(0);
              })
              .catch((err) => {
                console.error('Probe failed:', err.message);
                process.exit(1);
              });
          "
