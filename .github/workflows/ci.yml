name: Continuous Integration & Security Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Code Quality & Lint Check
        run: npx oxlint src

      - name: 2. Strict TypeScript Typecheck
        run: npx tsc --noEmit

      - name: 3. Automated Unit & Logic Tests
        run: npx vitest run

      - name: 4. Production Web Bundle Verification
        run: npm run build
